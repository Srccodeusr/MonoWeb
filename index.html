<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>MonoNode — Bot Hosting &amp; VPS Hosting</title>
    <meta name="description" content="MonoNode offers high-performance Bot Hosting and VPS Hosting on reliable, low-latency infrastructure with real human support." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=block" rel="stylesheet">

    <!-- MonoNode boot loader: styles live inline so it paints before any JS/CSS bundle loads -->
    <style>
      #mn-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      #mn-loader.mn-loader--out { opacity: 0; pointer-events: none; }

      #mn-loader .mn-word {
        display: flex;
        font-family: 'Michroma', 'Orbitron', 'Chakra Petch', 'Archivo', system-ui, sans-serif;
        font-size: clamp(11px, 0.9vw + 8px, 18px);
        letter-spacing: 0.06em;
        line-height: 1;
        user-select: none;
        -webkit-user-select: none;
      }
      #mn-loader .mn-word span {
        color: #4b4b4f;
        opacity: 0.55;
        animation: mn-twinkle var(--d, 2s) ease-in-out var(--o, 0s) infinite;
        will-change: opacity, color;
      }
      /* Each letter has its own speed + offset, so the brightness ripples randomly */
      #mn-loader .mn-word span:nth-child(1) { --d: 1.9s; --o: -0.2s; }
      #mn-loader .mn-word span:nth-child(2) { --d: 2.6s; --o: -1.4s; }
      #mn-loader .mn-word span:nth-child(3) { --d: 2.1s; --o: -0.7s; }
      #mn-loader .mn-word span:nth-child(4) { --d: 1.7s; --o: -1.9s; }
      #mn-loader .mn-word span:nth-child(5) { --d: 2.4s; --o: -0.4s; }
      #mn-loader .mn-word span:nth-child(6) { --d: 2.0s; --o: -1.1s; }
      #mn-loader .mn-word span:nth-child(7) { --d: 2.8s; --o: -2.2s; }
      #mn-loader .mn-word span:nth-child(8) { --d: 1.8s; --o: -0.9s; }

      @keyframes mn-twinkle {
        0%, 100% { color: #46464a; opacity: 0.5; }
        45%      { color: #f4f4f5; opacity: 1; }
        70%      { color: #8a8a90; opacity: 0.8; }
      }
      @media (prefers-reduced-motion: reduce) {
        #mn-loader .mn-word span { animation: none; color: #a1a1a6; opacity: 0.9; }
        #mn-loader { transition-duration: 0.01s; }
      }
    </style>
    <noscript><style>#mn-loader { display: none !important; }</style></noscript>

    <script>
      (function() {
        if (typeof window !== 'undefined') {
          if (typeof window.global === 'undefined') {
            window.global = window;
          }
          try {
            var _currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _currentFetch;
              },
              set: function(val) {
                _currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            console.warn('Fetch property patch failed:', e);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="mn-loader" role="status" aria-live="polite" aria-label="Loading MonoNode">
      <div class="mn-word" aria-hidden="true"><span>M</span><span>O</span><span>N</span><span>O</span><span>N</span><span>O</span><span>D</span><span>E</span></div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('mn-loader');
        if (!el) return;
        var MIN_MS = 1200;   // show the animation at least this long
        var MAX_MS = 15000;  // safety: never trap the user behind the loader
        var start = Date.now();
        var hiding = false;

        function remove() {
          if (el && el.parentNode) el.parentNode.removeChild(el);
          el = null;
        }
        function fadeOut() {
          if (!el) return;
          el.classList.add('mn-loader--out');
          setTimeout(remove, 600);
        }
        function hide() {
          if (hiding) return;
          hiding = true;
          var go = function () {
            setTimeout(fadeOut, Math.max(0, MIN_MS - (Date.now() - start)));
          };
          if (document.readyState === 'complete') go();
          else window.addEventListener('load', go, { once: true });
        }

        window.__monoLoader = { hide: hide };
        setTimeout(hide, MAX_MS);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
