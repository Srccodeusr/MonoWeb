<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="MonoWeb banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="#000"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect y="200" width="1200" height="120" fill="url(#fade)"/>

  <!-- window chrome mock -->
  <g transform="translate(60 40)">
    <rect width="1080" height="240" rx="14" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="26" cy="24" r="6" fill="#fff" fill-opacity="0.9"/>
    <circle cx="48" cy="24" r="6" fill="#fff" fill-opacity="0.5"/>
    <circle cx="70" cy="24" r="6" fill="#fff" fill-opacity="0.25"/>
    <rect x="120" y="12" width="420" height="24" rx="12" fill="#fff" fill-opacity="0.07"/>
    <text x="140" y="29" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#fff" fill-opacity="0.55">https://your-domain.com/admin</text>
    <line x1="0" y1="48" x2="1080" y2="48" stroke="#fff" stroke-opacity="0.12"/>

    <text x="540" y="130" text-anchor="middle" font-family="'Chakra Petch','Segoe UI',Helvetica,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="10" fill="#fff">MONOWEB</text>
    <rect x="290" y="148" width="500" height="1.5" fill="url(#line)"/>
    <text x="540" y="182" text-anchor="middle" font-family="'Quicksand','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" letter-spacing="4" fill="#fff" fill-opacity="0.75">WEBSITE  ·  BILLING  ·  ADMIN PANEL</text>
    <text x="540" y="212" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#fff" fill-opacity="0.4">BLACK &amp; WHITE. FAST. NO DATABASE SERVER.</text>
  </g>
</svg>
